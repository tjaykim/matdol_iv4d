name: build & release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release (v<Version> from matdol.csproj) with the packages"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: cmd
        run: call package-win.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/installers/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish linux-x64
        run: dotnet publish matdol.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o artifacts/publish/linux-x64
      - name: Build .deb and .tar.gz
        run: dotnet run --project installer/linux/packager -c Release -- artifacts/publish/linux-x64 . artifacts/installers
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/installers/*
          if-no-files-found: error

  release:
    if: inputs.release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' matdol.csproj | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: matdol ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*
